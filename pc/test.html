<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI T·V · 作品集</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5/dist/cos-js-sdk-v5.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(145deg, #f5f7fa 0%, #e9eef3 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 顶部导航栏 */
        .timeline-header {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(30px) saturate(120%);
            border-radius: 34px;
            border: 0.5px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .timeline-header {
                top: 12px;
                left: 12px;
                right: 12px;
                padding: 8px 16px;
                border-radius: 28px;
            }
        }

        .back-btn-inline,
        .nav-btn,
        .upload-btn,
        .delete-mode-btn {
            background: rgba(120, 120, 128, 0.3);
            backdrop-filter: blur(15px);
            border: 0.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            color: #ffcc00;
            flex-shrink: 0;
        }

        .delete-mode-btn {
            color: #ff6b6b;
        }

        .back-btn-inline:hover,
        .nav-btn:hover,
        .upload-btn:hover,
        .delete-mode-btn:hover {
            background: rgba(120, 120, 128, 0.5);
            transform: scale(0.96);
        }

        .header-title {
            flex: 1;
            text-align: center;
        }

        .header-title h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #ffecb3);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .sub {
            font-size: 0.7rem;
            opacity: 0.7;
            color: #ddd;
            margin-top: 2px;
            display: block;
        }

        .nav-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* 下拉菜单 */
        .dropdown-menu {
            display: none;
            position: fixed;
            top: calc(env(safe-area-inset-top, 20px) + 80px);
            left: calc(env(safe-area-inset-left, 20px) + 20px);
            width: 150px;
            background: rgba(30, 30, 35, 0.96);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 240, 0.2);
            border-radius: 20px;
            padding: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transform: scale(0.4) translate(-30px, -30px);
            opacity: 0;
            transform-origin: top left;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 9999;
        }

        .dropdown-menu.active {
            display: block;
            transform: scale(1) translate(0, 0);
            opacity: 1;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: #f0f0f0;
            text-decoration: none;
            font-size: 14px;
            border-radius: 16px;
        }

        .menu-item:hover {
            background: rgba(255, 204, 0, 0.2);
        }

        /* 主内容区 */
        .app-container {
            height: 100vh;
            padding-top: 86px;
            padding-bottom: 82px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        @media (max-width: 768px) {
            .app-container {
                padding-top: 78px;
                padding-bottom: 72px;
            }
        }

        .panel {
            display: none;
            animation: fade 0.25s ease;
        }

        .panel.active-panel {
            display: block;
        }

        @keyframes fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* 图片画布布局 - 弹性换行，原图比例，无圆角 */
        .image-canvas {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .art-card {
            position: relative;
            background: transparent;
            backdrop-filter: none;
            border-radius: 0;
            overflow: visible;
            box-shadow: none;
            border: none;
            transition: 0.1s;
        }

        .art-card img {
            width: auto;
            max-width: 280px;
            height: auto;
            display: block;
            object-fit: contain;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 0;
        }

        /* 删除模式下的复选框 */
        .delete-checkbox {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            border: 1px solid white;
        }

        .delete-checkbox.selected {
            background: #ffcc00;
        }

        .delete-checkbox.selected svg {
            stroke: #1a1a1a;
        }

        .art-card.selected-mode img {
            opacity: 0.7;
        }

        /* 删除模式底部栏 */
        .delete-bottom-bar {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            z-index: 150;
            border: 0.5px solid rgba(255, 100, 100, 0.6);
        }

        .delete-confirm-btn {
            flex: 1;
            background: #ff3b30;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .delete-cancel-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .empty-tip {
            text-align: center;
            padding: 40px;
            color: #888;
            font-weight: 500;
        }

        /* 视频页面样式（保持不变） */
        .gallery-strip {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            margin: 16px;
            padding: 12px;
        }

        .gallery-strip-title {
            font-size: 1rem;
            font-weight: 600;
            margin-left: 8px;
            margin-bottom: 12px;
            color: #ffcc44;
        }

        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 12px;
            scrollbar-width: thin;
        }

        .horizontal-scroll img {
            width: 110px;
            height: 110px;
            border-radius: 20px;
            object-fit: cover;
            background: #2c2c2e;
            flex-shrink: 0;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }

        .video-swipe-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 70vh;
            border-radius: 28px;
            background: #00000022;
            margin: 0 12px 20px 12px;
        }

        .video-item {
            scroll-snap-align: start;
            height: 70vh;
            position: relative;
            background: #0a0a0a;
            border-radius: 32px;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 200, 100, 0.4);
        }

        .video-item video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
            pointer-events: none;
        }

        .custom-controls {
            position: absolute;
            bottom: 12px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            pointer-events: auto;
        }

        .play-pause-btn,
        .mute-toggle {
            background: rgba(255, 215, 0, 0.85);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #1e1e2a;
            transition: 0.1s;
        }

        .mute-toggle {
            background: rgba(255, 80, 40, 0.9);
            color: white;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ffcc00;
            border-radius: 4px;
        }

        .time-label {
            font-size: 11px;
            color: white;
            font-family: monospace;
            min-width: 70px;
        }

        .unmute-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffcc00;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid #ffcc66;
            z-index: 15;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .unmute-badge:active {
            transform: scale(0.96);
        }

        /* 底部标签栏 */
        .bottom-tab-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            z-index: 100;
            background: rgba(20, 20, 25, 0.8);
            backdrop-filter: blur(32px);
            border-radius: 36px;
            display: flex;
            justify-content: space-around;
            padding: 8px 12px;
            border: 0.5px solid rgba(255, 215, 0, 0.4);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            flex: 1;
            cursor: pointer;
            padding: 6px;
            border-radius: 32px;
            color: #aaa;
            transition: 0.2s;
        }

        .tab-item i {
            width: 24px;
            height: 24px;
            stroke-width: 1.8;
        }

        .tab-item span {
            font-size: 0.65rem;
            font-weight: 500;
        }

        .tab-item.active {
            color: #ffcc00;
            background: rgba(255, 204, 0, 0.2);
            box-shadow: inset 0 1px 1px rgba(255, 255, 200, 0.2);
        }

        .tab-item.active i {
            stroke: #ffcc00;
        }

        .footer-note {
            font-size: 10px;
            text-align: center;
            color: #aaa;
            padding: 12px;
        }

        /* 上传模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-container {
            width: 90%;
            max-width: 420px;
            background: rgba(30, 30, 35, 0.96);
            backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 28px 24px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-container h3 {
            color: white;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.6rem;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .modal-input:focus {
            border-color: #ffcc00;
        }

        .file-input-label {
            background: rgba(255, 204, 0, 0.2);
            border: 1px dashed #ffcc00;
            border-radius: 32px;
            padding: 16px;
            text-align: center;
            color: #ffcc00;
            margin-bottom: 20px;
            cursor: pointer;
            display: block;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
        }

        .modal-btn-primary {
            background: #ffcc00;
            color: #1a1a1a;
        }

        .modal-btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .modal-btn-primary:active,
        .modal-btn-secondary:active {
            transform: scale(0.97);
        }

        .upload-status {
            font-size: 12px;
            margin-top: 12px;
            text-align: center;
            color: #ffcc66;
        }
    </style>
</head>

<body>

    <div class="timeline-header">
        <button class="nav-btn" id="menu-trigger"><i data-lucide="menu"></i></button>
        <button class="back-btn-inline" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
        <div class="header-title">
            <h1>AI T·V</h1>
            <span class="sub">影像·创造力聚合</span>
        </div>
        <div class="nav-group" id="navGroup">
            <button class="upload-btn" id="globalUploadBtn"><i data-lucide="upload"></i></button>
            <button class="delete-mode-btn" id="deleteModeBtn" style="display: none;"><i data-lucide="trash-2"></i></button>
        </div>
    </div>

    <!-- 下拉菜单 -->
    <div class="dropdown-menu" id="dropdown-menu">
        <a href="index.html" class="menu-item"><i data-lucide="home"></i>主页</a>
        <a href="moments.html" class="menu-item"><i data-lucide="heart"></i>朋友圈</a>
        <a href="photo.html" class="menu-item"><i data-lucide="image"></i>相册</a>
        <a href="about.html" class="menu-item"><i data-lucide="user"></i>关于我</a>
        <a href="admin.html" class="menu-item"><i data-lucide="settings"></i>后台管理</a>
        <a href="links.html" class="menu-item"><i data-lucide="link"></i>友情链接</a>
    </div>

    <!-- 上传模态框 -->
    <div id="uploadModal" class="modal-overlay">
        <div class="modal-container">
            <h3>📤 上传图片</h3>
            <input type="password" id="modalPassword" class="modal-input" placeholder="请输入上传密码" autocomplete="off">
            <label class="file-input-label" id="fileSelectLabel">
                📸 选择图片 (最多9张)
                <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
            </label>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" id="confirmUploadBtn">上传</button>
                <button class="modal-btn modal-btn-secondary" id="closeModalBtn">取消</button>
            </div>
            <div id="uploadStatus" class="upload-status"></div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div id="imagesPanel" class="panel active-panel">
            <div class="image-canvas" id="imageGrid"></div>
            <div class="footer-note">🎨 AI生成的影像画廊</div>
        </div>
        <div id="videosPanel" class="panel">
            <div class="gallery-strip">
                <div class="gallery-strip-title">📸 精选静帧 · 下滑开启影音</div>
                <div class="horizontal-scroll" id="videoPageGallery"></div>
            </div>
            <div class="video-swipe-container" id="videoSwipeList"></div>
            <div class="footer-note">🎬 上下滑动切换视频 · 轻触静音按钮恢复声音</div>
        </div>
    </div>

    <div class="bottom-tab-bar">
        <button class="tab-item active" data-panel="images"><i data-lucide="image"></i><span>图片</span></button>
        <button class="tab-item" data-panel="videos"><i data-lucide="video"></i><span>视频</span></button>
    </div>

    <script>
        // ======================== 配置区 ==========================
        const SUPABASE_URL = "https://hmsovwceyinvwgplgywr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_n4PuuvoT5HLgcKbPM41BkQ_XbKctJtS";
        const COS_CONFIG = {
            SecretId: 'AKID63lERP6XjnhPrAD0XnqdARSFm35sQipi',
            SecretKey: 'g7IFwNXS9algMnytYy70f5E7g5FAqIVS',
            Bucket: 'hiomen-1312408524',
            Region: 'ap-guangzhou',
        };

        let supabaseClient = null;
        let cosInstance = null;
        let currentActiveTab = "images";
        let allImages = [];
        let allVideos = [];
        let videoElementsMap = new Map();
        let currentPlayingVideo = null;
        let observer = null;

        // 删除模式相关
        let deleteModeActive = false;
        let selectedImageUrls = new Set(); // 存储待删除图片的 url
        let deleteBottomBar = null;

        function initSDK() {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            cosInstance = new COS({
                SecretId: COS_CONFIG.SecretId,
                SecretKey: COS_CONFIG.SecretKey,
            });
        }

        // 密码验证（RPC 方式，前提是已创建函数 check_upload_password）
        async function verifyPasswordViaSupabase(pwd) {
            if (!supabaseClient) {
                alert("Supabase 未配置");
                return false;
            }
            const { data, error } = await supabaseClient.rpc('check_upload_password', { input_pwd: pwd });
            if (error) {
                console.error(error);
                alert("验证服务出错");
                return false;
            }
            return data === true;
        }

        async function uploadToCOS(file, type) {
            if (!cosInstance) {
                alert("COS未配置");
                return null;
            }
            const ext = file.name.split('.').pop();
            const key = `aiworks/${type}/${Date.now()}_${Math.random().toString(36).substr(2, 6)}.${ext}`;
            return new Promise((resolve, reject) => {
                cosInstance.putObject({
                    Bucket: COS_CONFIG.Bucket,
                    Region: COS_CONFIG.Region,
                    Key: key,
                    Body: file,
                    onProgress: (progressData) => console.log("上传进度", progressData)
                }, (err, data) => {
                    if (err) reject(err);
                    else {
                        const url = `https://${COS_CONFIG.Bucket}.cos.${COS_CONFIG.Region}.myqcloud.com/${key}`;
                        resolve(url);
                    }
                });
            });
        }

        async function saveMediaToDB(url, type) {
            if (!supabaseClient) return false;
            const { error } = await supabaseClient.from("media_items").insert([
                { url: url, type: type, created_at: new Date().toISOString() }
            ]);
            if (error) {
                console.error(error);
                alert("记录失败，但文件已上传");
                return false;
            }
            return true;
        }

        async function fetchMediaItems() {
            if (!supabaseClient) return [];
            const { data, error } = await supabaseClient
                .from("media_items")
                .select("*")
                .order("created_at", { ascending: false });
            if (error) {
                console.error(error);
                return [];
            }
            return data || [];
        }

        // 刷新图片面板（带删除模式支持）
        async function refreshImagesPanel() {
            const items = await fetchMediaItems();
            allImages = items.filter(item => item.type === "image");
            const shuffled = [...allImages];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const grid = document.getElementById("imageGrid");
            if (!grid) return;
            if (shuffled.length === 0) {
                grid.innerHTML = `<div class="empty-tip">✨ 暂无AI图片作品，点击右上角上传 ✨</div>`;
                return;
            }
            grid.innerHTML = shuffled.map(img => `
            <div class="art-card" data-url="${img.url}">
                <img src="${img.url}" loading="lazy" alt="ai artwork" onerror="this.src='https://placehold.co/400?text=load+error'">
            </div>
        `).join("");

            // 如果删除模式激活，重新渲染复选框并添加点击事件
            if (deleteModeActive) {
                attachDeleteCheckboxes();
            }
        }

        // 附加删除复选框及高亮
        function attachDeleteCheckboxes() {
            const cards = document.querySelectorAll('#imageGrid .art-card');
            cards.forEach(card => {
                // 避免重复添加
                if (card.querySelector('.delete-checkbox')) return;
                const url = card.getAttribute('data-url');
                const checkboxDiv = document.createElement('div');
                checkboxDiv.className = 'delete-checkbox';
                if (selectedImageUrls.has(url)) {
                    checkboxDiv.classList.add('selected');
                }
                checkboxDiv.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="20 6 9 17 4 12 5.41 10.59 9 14.17 18.59 4.59 20 6"></polygon></svg>`;
                checkboxDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const url = card.getAttribute('data-url');
                    if (selectedImageUrls.has(url)) {
                        selectedImageUrls.delete(url);
                        checkboxDiv.classList.remove('selected');
                    } else {
                        selectedImageUrls.add(url);
                        checkboxDiv.classList.add('selected');
                    }
                });
                card.style.position = 'relative';
                card.appendChild(checkboxDiv);
                card.classList.add('selected-mode');
            });
        }

        // 退出删除模式，清除UI和状态
        function exitDeleteMode() {
            deleteModeActive = false;
            selectedImageUrls.clear();
            if (deleteBottomBar) deleteBottomBar.remove();
            deleteBottomBar = null;
            // 隐藏删除按钮，显示上传按钮
            const deleteBtn = document.getElementById('deleteModeBtn');
            const uploadBtn = document.getElementById('globalUploadBtn');
            if (deleteBtn) deleteBtn.style.display = 'none';
            if (uploadBtn) uploadBtn.style.display = 'flex';
            // 重新刷新图片面板以移除复选框
            refreshImagesPanel();
        }

        // 进入删除模式
        function enterDeleteMode() {
            if (deleteModeActive) return;
            deleteModeActive = true;
            selectedImageUrls.clear();
            // 隐藏上传按钮，显示删除按钮（即“取消”功能的按钮）
            const deleteBtn = document.getElementById('deleteModeBtn');
            const uploadBtn = document.getElementById('globalUploadBtn');
            if (deleteBtn) deleteBtn.style.display = 'flex';
            if (uploadBtn) uploadBtn.style.display = 'none';
            // 添加底部删除栏
            const bar = document.createElement('div');
            bar.className = 'delete-bottom-bar';
            bar.innerHTML = `
                <button class="delete-confirm-btn" id="confirmDeleteBtn">🗑️ 删除选中 (0)</button>
                <button class="delete-cancel-btn" id="cancelDeleteBtn">取消</button>
            `;
            document.body.appendChild(bar);
            deleteBottomBar = bar;
            document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
                if (selectedImageUrls.size === 0) {
                    alert("请至少选择一张图片");
                    return;
                }
                // 删除前验证密码
                const pwd = prompt("删除需要验证密码：");
                if (!pwd) return;
                const ok = await verifyPasswordViaSupabase(pwd);
                if (!ok) {
                    alert("密码错误，无法删除");
                    return;
                }
                // 从数据库中删除记录
                const urlsToDelete = Array.from(selectedImageUrls);
                for (let url of urlsToDelete) {
                    const { error } = await supabaseClient
                        .from("media_items")
                        .delete()
                        .eq("url", url);
                    if (error) console.error("删除失败", url, error);
                }
                alert(`已删除 ${urlsToDelete.length} 张图片（仅从相册移除，COS文件仍保留）`);
                exitDeleteMode();
                await refreshImagesPanel();
                if (currentActiveTab === "videos") await refreshVideosPanel(); // 同步视频页面画廊
            });
            document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
                exitDeleteMode();
            });
            // 重新渲染图片面板以勾选框
            refreshImagesPanel();
        }

        // 刷新视频面板
        async function refreshVideosPanel() {
            const items = await fetchMediaItems();
            allVideos = items.filter(item => item.type === "video");
            const allImagesForGallery = items.filter(item => item.type === "image");
            const galleryContainer = document.getElementById("videoPageGallery");
            if (galleryContainer) {
                if (allImagesForGallery.length === 0) {
                    galleryContainer.innerHTML = `<div style="color:#aaa; padding:12px;">暂无图片作品，上传后显示在此处</div>`;
                } else {
                    galleryContainer.innerHTML = allImagesForGallery.map(img => `<img src="${img.url}" loading="lazy" />`).join("");
                }
            }
            const swipeContainer = document.getElementById("videoSwipeList");
            if (!swipeContainer) return;
            if (allVideos.length === 0) {
                swipeContainer.innerHTML = `<div class="empty-tip" style="height: 50vh; display: flex; align-items:center;">🎥 暂无AI视频，点击上传视频作品</div>`;
                return;
            }
            swipeContainer.innerHTML = allVideos.map((video, idx) => `
            <div class="video-item" data-video-idx="${idx}" data-video-url="${video.url}">
                <video class="ai-video-element" preload="metadata" muted playsinline disablePictureInPicture
                       controlslist="nofullscreen" webkit-playsinline="true" x5-playsinline="true"
                       style="pointer-events:none;"
                       src="${video.url}"></video>
                <div class="custom-controls">
                    <button class="play-pause-btn" data-action="playpause">⏸️</button>
                    <div class="progress-bar" data-action="seek">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="time-label">0:00 / 0:00</span>
                    <button class="mute-toggle" data-action="mute">🔇</button>
                </div>
                <div class="unmute-badge" data-action="forceunmute">🔊 点击解除静音</div>
            </div>
        `).join("");

            // 绑定视频控件（与原逻辑相同）
            document.querySelectorAll('.video-item').forEach((item, idx) => {
                const video = item.querySelector('video');
                if (!video) return;
                const playPauseBtn = item.querySelector('[data-action="playpause"]');
                const progressBar = item.querySelector('.progress-bar');
                const progressFill = progressBar?.querySelector('.progress-fill');
                const timeLabel = item.querySelector('.time-label');
                const muteToggleBtn = item.querySelector('[data-action="mute"]');
                const unmuteBadge = item.querySelector('[data-action="forceunmute"]');

                video.addEventListener('contextmenu', (e) => e.preventDefault());
                video.addEventListener('touchstart', (e) => { if (e.target === video) e.preventDefault(); });

                video.muted = true;
                function updatePlayPauseIcon() {
                    if (video.paused) playPauseBtn.innerHTML = "▶️";
                    else playPauseBtn.innerHTML = "⏸️";
                }
                function updateMuteIcon() {
                    muteToggleBtn.innerHTML = video.muted ? "🔇" : "🔊";
                }
                function updateTime() {
                    if (video.duration) {
                        const percent = (video.currentTime / video.duration) * 100;
                        if (progressFill) progressFill.style.width = `${percent}%`;
                        const format = (t) => `${Math.floor(t / 60)}:${Math.floor(t % 60).toString().padStart(2, '0')}`;
                        timeLabel.innerText = `${format(video.currentTime)} / ${format(video.duration)}`;
                    }
                }
                video.addEventListener('timeupdate', updateTime);
                video.addEventListener('play', updatePlayPauseIcon);
                video.addEventListener('pause', updatePlayPauseIcon);
                video.addEventListener('volumechange', updateMuteIcon);

                playPauseBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (video.paused) video.play().catch(e => console.log);
                    else video.pause();
                });
                if (progressBar) {
                    progressBar.addEventListener('click', (e) => {
                        const rect = progressBar.getBoundingClientRect();
                        const percent = (e.clientX - rect.left) / rect.width;
                        if (video.duration) video.currentTime = percent * video.duration;
                    });
                }
                muteToggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    video.muted = !video.muted;
                });
                if (unmuteBadge) {
                    unmuteBadge.addEventListener('click', (e) => {
                        e.stopPropagation();
                        video.muted = false;
                        if (video.paused) video.play().catch(e => console);
                    });
                }
                updateMuteIcon();
                updatePlayPauseIcon();
                videoElementsMap.set(video.src || video.currentSrc || allVideos[idx]?.url, { video, playPauseBtn, item });
            });
            setupVideoScrollObserver();
        }

        function setupVideoScrollObserver() {
            if (observer) observer.disconnect();
            const videos = document.querySelectorAll('.video-item video');
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
                        document.querySelectorAll('.video-item video').forEach(v => {
                            if (v !== video && !v.paused) v.pause();
                        });
                        if (video.paused) video.play().catch(e => console.log("autoplay block"));
                        currentPlayingVideo = video;
                    } else {
                        if (!video.paused && video === currentPlayingVideo) video.pause();
                    }
                });
            }, { threshold: 0.6 });
            videos.forEach(v => observer.observe(v));
        }

        // 上传逻辑（支持多图）
        async function uploadMultipleImages(files, password) {
            const statusDiv = document.getElementById('uploadStatus');
            let successCount = 0;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusDiv.innerText = `上传中 ${i+1}/${files.length}: ${file.name}`;
                const url = await uploadToCOS(file, 'image');
                if (!url) {
                    statusDiv.innerText = `上传失败: ${file.name}`;
                    continue;
                }
                const saved = await saveMediaToDB(url, 'image');
                if (saved) successCount++;
            }
            statusDiv.innerText = `✅ 成功上传 ${successCount} 张图片`;
            setTimeout(() => {
                document.getElementById('uploadModal').style.display = 'none';
                refreshImagesPanel();
                if (currentActiveTab === "videos") refreshVideosPanel();
            }, 1500);
        }

        // 模态框上传按钮逻辑
        function setupUploadModal() {
            const modal = document.getElementById('uploadModal');
            const uploadBtn = document.getElementById('globalUploadBtn');
            const closeBtn = document.getElementById('closeModalBtn');
            const confirmBtn = document.getElementById('confirmUploadBtn');
            const fileInput = document.getElementById('fileInput');
            const fileLabel = document.getElementById('fileSelectLabel');

            uploadBtn.addEventListener('click', () => {
                if (currentActiveTab !== "images") {
                    alert("请在图片页面进行图片上传");
                    return;
                }
                modal.style.display = 'flex';
                document.getElementById('modalPassword').value = '';
                document.getElementById('uploadStatus').innerHTML = '';
                fileInput.value = '';
            });
            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });
            fileLabel.addEventListener('click', () => {
                fileInput.click();
            });
            confirmBtn.addEventListener('click', async () => {
                const password = document.getElementById('modalPassword').value;
                if (!password) {
                    alert("请输入密码");
                    return;
                }
                const valid = await verifyPasswordViaSupabase(password);
                if (!valid) {
                    alert("密码错误");
                    return;
                }
                const files = fileInput.files;
                if (!files || files.length === 0) {
                    alert("请至少选择一张图片");
                    return;
                }
                if (files.length > 9) {
                    alert("最多只能选择9张图片");
                    return;
                }
                await uploadMultipleImages(Array.from(files), password);
            });
        }

        // 切换面板
        function switchPanel(panelId) {
            const imagesPanel = document.getElementById("imagesPanel");
            const videosPanel = document.getElementById("videosPanel");
            if (panelId === "images") {
                imagesPanel.classList.add("active-panel");
                videosPanel.classList.remove("active-panel");
                currentActiveTab = "images";
                refreshImagesPanel();
                // 显示图片删除按钮，隐藏视频删除（但视频不要删除按钮）
                const deleteBtn = document.getElementById('deleteModeBtn');
                if (deleteBtn) deleteBtn.style.display = 'flex';
                if (deleteModeActive) exitDeleteMode(); // 如果处于删除模式，退出
            } else {
                imagesPanel.classList.remove("active-panel");
                videosPanel.classList.add("active-panel");
                currentActiveTab = "videos";
                refreshVideosPanel();
                // 视频页面隐藏删除模式按钮
                const deleteBtn = document.getElementById('deleteModeBtn');
                if (deleteBtn) deleteBtn.style.display = 'none';
                if (deleteModeActive) exitDeleteMode(); // 退出删除模式
            }
            document.querySelectorAll('.tab-item').forEach(tab => {
                const panelVal = tab.getAttribute("data-panel");
                if ((panelVal === "images" && panelId === "images") || (panelVal === "videos" && panelId === "videos")) {
                    tab.classList.add("active");
                } else {
                    tab.classList.remove("active");
                }
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        // 初始化菜单
        function initMenus() {
            const menuBtn = document.getElementById("menu-trigger");
            const dropdown = document.getElementById("dropdown-menu");
            menuBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                dropdown.classList.toggle("active");
            });
            window.addEventListener("click", (e) => {
                if (!menuBtn.contains(e.target) && !dropdown.contains(e.target)) dropdown.classList.remove("active");
            });
            // 删除模式按钮（垃圾桶）
            const deleteModeBtn = document.getElementById('deleteModeBtn');
            deleteModeBtn.addEventListener('click', () => {
                if (currentActiveTab !== "images") return;
                if (deleteModeActive) {
                    exitDeleteMode();
                } else {
                    enterDeleteMode();
                }
            });
            document.querySelectorAll('.tab-item').forEach(btn => {
                btn.addEventListener("click", () => {
                    const target = btn.getAttribute("data-panel");
                    switchPanel(target);
                });
            });
        }

        async function initDemoCheck() {
            if (!supabaseClient) {
                document.getElementById("imageGrid").innerHTML = `<div class="empty-tip">⚠️ Supabase未配置，请配置后再上传/展示真实作品。</div>`;
            } else {
                await refreshImagesPanel();
            }
        }

        (async () => {
            initSDK();
            initMenus();
            setupUploadModal();
            await initDemoCheck();
            if (typeof lucide !== 'undefined') lucide.createIcons();
            window.addEventListener('resize', () => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
        })();

        window.refreshVideosPanel = refreshVideosPanel;
    </script>
    <script>
        setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 200);
    </script>
</body>
