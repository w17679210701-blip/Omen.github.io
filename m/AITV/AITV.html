<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>作品集 · AI短片</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #f5f7fa 0%, #e9eef3 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            color: #1e293b;
            padding: 0 12px 40px 12px;
            min-height: 100vh;
        }

        /* ----- 顶部导航栏（完全复刻 runtian 风格）----- */
        .timeline-header {
            position: sticky;
            top: 12px;
            z-index: 200;
            background: transparent;
            backdrop-filter: blur(30px) saturate(120%) brightness(0.9);
            -webkit-backdrop-filter: blur(30px) saturate(120%) brightness(0.9);
            border-radius: 28px;
            border: 0.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.02);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .timeline-header::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 30% 50%, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            filter: blur(4px);
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .back-btn-inline,
        .nav-btn {
            background: rgba(120, 120, 128, 0.2);
            backdrop-filter: blur(15px);
            border: 0.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: #007aff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .back-btn-inline:active,
        .nav-btn:active {
            transform: scale(0.94);
        }

        .back-btn-inline svg,
        .nav-btn svg {
            stroke: currentColor;
            width: 20px;
            height: 20px;
        }

        .header-title {
            flex: 1;
            min-width: 0;
        }

        .header-title h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1a1a1a, #3a3a3a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-title .sub {
            font-size: 0.7rem;
            opacity: 0.9;
            display: block;
            margin-top: 2px;
            color: #333;
        }

        /* ----- 下拉菜单 ----- */
        .dropdown-menu {
            display: none;
            position: fixed;
            top: calc(env(safe-area-inset-top, 12px) + 70px);
            left: 20px;
            width: 150px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            transform: scale(0.9);
            opacity: 0;
            transform-origin: top left;
            transition: all 0.2s ease;
            z-index: 9999;
        }

        .dropdown-menu.active {
            display: block;
            transform: scale(1);
            opacity: 1;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: #1a1a1a;
            text-decoration: none;
            font-size: 15px;
            border-radius: 16px;
            transition: 0.2s;
        }

        .menu-item:hover,
        .menu-item:active {
            background: rgba(128, 128, 128, 0.1);
        }

        /* ----- 页面介绍 ----- */
        .page-intro {
            text-align: center;
            padding: 20px 16px 24px;
        }

        .page-intro h2 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .page-intro p {
            font-size: 0.85rem;
            color: #64748b;
            letter-spacing: 2px;
        }

        /* ----- 作品网格 ----- */
        .portfolio-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 800px;
            margin: 0 auto;
        }

        .work-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-decoration: none;
            color: inherit;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: block;
        }

        .work-card:active {
            transform: scale(0.98);
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.15);
        }

        .work-cover {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f172a;
            overflow: hidden;
        }

        .work-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .play-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            transition: transform 0.2s ease;
        }

        .work-card:active .play-badge {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .work-info {
            padding: 16px 18px 18px;
        }

        .work-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .work-desc {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #475569;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .work-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: #94a3b8;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 10px;
        }

        .work-tag {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.68rem;
            letter-spacing: 0.5px;
        }

        .footer-note {
            text-align: center;
            margin-top: 36px;
            font-size: 0.72rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <!-- 导航栏 -->
    <div class="timeline-header" id="timelineHeader">
        <button class="nav-btn" id="menu-trigger" onclick="toggleMenu(event)"><i data-lucide="menu"></i></button>
        <button class="back-btn-inline" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>
        <div class="header-title">
            <h1>作品集</h1>
            <span class="sub">AI短片作品合集</span>
        </div>
    </div>

    <!-- 下拉菜单 -->
    <div class="dropdown-menu" id="dropdown-menu">
        <a href="index.html" class="menu-item"><i data-lucide="home" size="18"></i>主页</a>
        <a href="about.html" class="menu-item"><i data-lucide="user" size="18"></i>关于我</a>
    </div>

    <!-- 页面介绍 -->
    <div class="page-intro">
        <h2>AI 短片作品集</h2>
        <p>— COLLECTION —</p>
    </div>

    <!-- 作品列表 -->
    <div class="portfolio-grid">

        <a href="qitong01.html" class="work-card">
            <div class="work-cover">
                <img src="https://hiomen-1312408524.cos.ap-guangzhou.myqcloud.com/AITV/%E5%88%9B%E4%BD%9C%E7%B4%A0%E6%9D%90/%E5%B0%8F%E7%8C%AB%E5%9C%A8%E5%9C%B0%E4%B8%8A2.png"
                    alt="绝世好猫">
                <div class="play-badge">▶</div>
            </div>
            <div class="work-info">
                <div class="work-title">《绝世好猫》</div>
                <div class="work-desc">一部猫的产品短片，顺便征婚（假的）</div>
                <div class="work-meta">
                    <span class="work-tag">AI 短片</span>
                    <span>2026-09-10</span>
                </div>
            </div>
        </a>

        <!-- 作品 1 -->
        <a href="runtian.html" class="work-card">
            <div class="work-cover">
                <img src="https://hiomen-1312408524.cos.ap-guangzhou.myqcloud.com/AITV/%E6%B6%A6%E7%94%B0%E5%B0%81%E9%9D%A2.png"
                    alt="静下来净下来">
                <div class="play-badge">▶</div>
            </div>
            <div class="work-info">
                <div class="work-title">《静下来净下来》</div>
                <div class="work-desc">一部关于内心平静的AI短片</div>
                <div class="work-meta">
                    <span class="work-tag">AI 短片</span>
                    <span>2026-09-10</span>
                </div>
            </div>
        </a>

        <!-- 作品 2 -->
        <a href="goodboy.html" class="work-card">
            <div class="work-cover">
                <img src="https://hiomen-1312408524.cos.ap-guangzhou.myqcloud.com/AITV/%E9%95%9C%E5%8F%B71_1.png"
                    alt="好孩子">
                <div class="play-badge">▶</div>
            </div>
            <div class="work-info">
                <div class="work-title">《好孩子》</div>
                <div class="work-desc">男主因无法管教自己的孩子等家庭琐事而找到心理医生大发牢骚，结果让一个大男人唧唧歪歪的竟然是一只小猫。</div>
                <div class="work-meta">
                    <span class="work-tag">AI 短片</span>
                    <span>2026-08-20</span>
                </div>
            </div>
        </a>

        <!-- 作品 3 -->
        <a href="bailang.html" class="work-card">
            <div class="work-cover">
                <img src="https://hiomen-1312408524.cos.ap-guangzhou.myqcloud.com/AITV/%E5%88%9B%E4%BD%9C%E7%B4%A0%E6%9D%90/%E7%99%BD%E7%8B%BC%E5%B0%81%E9%9D%A2"
                    alt="我救的白狼是公爵">
                <div class="play-badge">▶</div>
            </div>
            <div class="work-info">
                <div class="work-title">《我救的白狼是公爵》</div>
                <div class="work-desc">奇幻题材AI短片，一个关于救赎与身份的温柔故事。</div>
                <div class="work-meta">
                    <span class="work-tag">AI 短片</span>
                    <span>2026-07-15</span>
                </div>
            </div>
        </a>

    </div>

    <div class="footer-note">持续更新中 ·  ❤️</div>

    <script>
        lucide.createIcons();

        function toggleMenu(e) {
            e.stopPropagation();
            document.getElementById('dropdown-menu').classList.toggle('active');
        }

        window.onclick = function (e) {
            const menu = document.getElementById('dropdown-menu');
            const trigger = document.getElementById('menu-trigger');
            if (menu && trigger && !trigger.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.remove('active');
            }
        };
    </script>
</body>

</html>
