<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI短片 · 天赐好水，润我心田</title>
    <!-- Lucide 图标库 (用于菜单图标) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #f5f7fa 0%, #e9eef3 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            color: #1e293b;
            padding: 20px 16px 50px 16px;
        }

        /* ----- 导航栏 (仿 moments 风格，仅左侧菜单+返回+标题) ----- */
        .timeline-header {
            position: sticky;
            top: 20px;
            z-index: 200;
            background: transparent;
            backdrop-filter: blur(30px) saturate(120%) brightness(0.9);
            border-radius: 34px;
            border: 0.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.02);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .timeline-header::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 30% 50%, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            filter: blur(4px);
            mix-blend-mode: overlay;
            pointer-events: none;
            transform: translateZ(-1px) scale(1.02);
        }

        .back-btn-inline,
        .nav-btn {
            background: rgba(120, 120, 128, 0.2);
            backdrop-filter: blur(15px);
            border: 0.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            flex-shrink: 0;
            color: #007aff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .back-btn-inline:hover,
        .nav-btn:hover {
            background: rgba(120, 120, 128, 0.35);
            transform: scale(0.96);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .back-btn-inline svg,
        .nav-btn svg {
            stroke: currentColor;
            width: 22px;
            height: 22px;
        }

        .header-title {
            flex: 0 1 auto;
            text-align: left;
            margin-right: auto;
        }

        .header-title h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1a1a1a, #3a3a3a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .header-title .sub {
            font-size: 0.75rem;
            opacity: 0.9;
            display: block;
            margin-top: 4px;
            color: #333;
        }

        /* 下拉菜单 (模仿原版朋友圈菜单，可复用) */
        .dropdown-menu {
            display: none;
            position: fixed;
            top: calc(env(safe-area-inset-top, 20px) + 80px);
            left: calc(env(safe-area-inset-left, 20px) + 20px);
            width: 150px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            transform: scale(0.4) translate(-30px, -30px);
            opacity: 0;
            transform-origin: top left;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 9999;
        }

        .dropdown-menu.active {
            display: block;
            transform: scale(1) translate(0, 0);
            opacity: 1;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: #1a1a1a;
            text-decoration: none;
            font-size: 15px;
            border-radius: 16px;
            transition: 0.2s;
        }

        .menu-item:hover {
            background: rgba(128, 128, 128, 0.1);
        }

        /* ----- 短剧展示内容区域 (卡片风格，简洁) ----- */
        .showcase-card {
            max-width: 800px;
            margin: 0 auto;
            transform: translateY(20px);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 1.5rem;
        }

        .video-wrapper {
            border-radius: 1.2rem;
            overflow: hidden;
            background: #000;
            margin-bottom: 1.5rem;
        }

        video {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #0f172a;
        }

        .work-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.3px;
            color: #0f172a;
        }

        .synopsis {
            font-size: 1rem;
            line-height: 1.55;
            color: #334155;
            margin-bottom: 1.8rem;
            border-left: 3px solid #3b82f6;
            padding-left: 1rem;
            background: #f8fafc;
            border-radius: 0 12px 12px 0;
            white-space: pre-wrap;
        }

        .related-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #1e293b;
        }

        .single-image {
            margin-top: 0.5rem;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15);
            background: #f1f5f9;
        }

        .single-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.2s ease;
        }

        .single-image img:hover {
            transform: scale(1.01);
        }

        .image-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .img-card {
            flex: 1;
            min-width: 150px;
            background: #f1f5f9;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }

        .img-card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        .img-caption {
            padding: 0.5rem;
            font-size: 0.7rem;
            text-align: center;
            color: #475569;
            background: white;
        }

        @media (max-width: 640px) {
            body {
                padding: 0 12px 30px 12px;
            }

            .showcase-card {
                padding: 1rem;
            }

            .work-title {
                font-size: 1.5rem;
            }

            .image-grid {
                flex-direction: column;
            }

            .timeline-header {
                padding: 6px 14px;
                margin-bottom: 16px;
            }

            .back-btn-inline,
            .nav-btn {
                width: 38px;
                height: 38px;
            }

            .header-title h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

        <!-- 视频区 -->
        <div class="video-wrapper">

    <script>
        // 初始化 lucide 图标（菜单图标）
        lucide.createIcons();

        // 菜单展开/收起逻辑
        function toggleMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('active');
        }

        // 点击页面其他位置关闭菜单
        window.onclick = function (e) {
            const menu = document.getElementById('dropdown-menu');
            const trigger = document.getElementById('menu-trigger');
            if (menu && trigger && !trigger.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.remove('active');
            }
        };

        // 可选：导航栏滚动阴影效果 (轻量)
        const header = document.querySelector('.timeline-header');
        let ticking = false;
        function updateHeaderShadow() {
            if (!header) return;
            const scrollY = window.scrollY;
            const intensity = Math.min(0.2, scrollY / 300);
            header.style.boxShadow = `0 8px 28px rgba(0,0,0,${0.08 + intensity}), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(0,0,0,0.02)`;
            ticking = false;
        }
        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(updateHeaderShadow);
                ticking = true;
            }
        });
        updateHeaderShadow();
    </script>
